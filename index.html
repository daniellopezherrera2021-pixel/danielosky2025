<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurador de Ordenadores</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Configura tu ordenador</h1>
  </header>

  <main class="container">
    <section class="image-section">
      <img id="pc-image" src="https://upload.wikimedia.org/wikipedia/commons/5/57/IMac_Pro_2017.svg" alt="Ordenador" />
    </section>

    <section class="config-section">
      <h2>Elige tus componentes</h2>

      <div class="option">
        <label for="cpu">Procesador</label>
        <select id="cpu">
          <option value="300">Intel i5 - $300</option>
          <option value="500">Intel i7 - $500</option>
          <option value="700">Intel i9 - $700</option>
        </select>
      </div>

      <div class="option">
        <label for="ram">Memoria RAM</label>
        <select id="ram">
          <option value="100">8 GB - $100</option>
          <option value="180">16 GB - $180</option>
          <option value="300">32 GB - $300</option>
        </select>
      </div>

      <div class="option">
        <label for="storage">Almacenamiento</label>
        <select id="storage">
          <option value="120">512 GB SSD - $120</option>
          <option value="200">1 TB SSD - $200</option>
          <option value="350">2 TB SSD - $350</option>
        </select>
      </div>

      <div class="option">
        <label for="gpu">Tarjeta Gráfica</label>
        <select id="gpu">
          <option value="250">NVIDIA GTX 1660 - $250</option>
          <option value="400">NVIDIA RTX 3060 - $400</option>
          <option value="600">NVIDIA RTX 4070 - $600</option>
        </select>
      </div>

      <div class="total">
        <h3>Precio total: <span id="total-price">$0</span></h3>
      </div>

      <button id="buy-btn">Comprar ahora</button>
    </section>
  </main>

  <footer>
    <p>© 2025 Configurador PC.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
